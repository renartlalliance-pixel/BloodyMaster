name: build-windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022          # image avec Visual Studio 2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (VS 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBM_DEPS_DIR=C:/bm_deps

      - name: Build (VST3 + Standalone + tests, Release)
        run: cmake --build build --config Release --parallel

      - name: Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verifier la presence des livrables
        shell: pwsh
        run: |
          $exe  = "build/BloodyMaster_artefacts/Release/Standalone/Bloody Master.exe"
          $vst3 = "build/BloodyMaster_artefacts/Release/VST3/Bloody Master.vst3"
          if (-not (Test-Path $exe))  { throw "Standalone .exe absent : $exe" }
          if (-not (Test-Path $vst3)) { throw "VST3 absent : $vst3" }
          Get-ChildItem -Recurse "build/BloodyMaster_artefacts/Release" | Select-Object FullName, Length

      - name: Artefact - Standalone .exe
        uses: actions/upload-artifact@v4
        with:
          name: BloodyMaster-Standalone-x64
          path: build/BloodyMaster_artefacts/Release/Standalone/Bloody Master.exe
          if-no-files-found: error

      - name: Artefact - VST3
        uses: actions/upload-artifact@v4
        with:
          name: BloodyMaster-VST3-x64
          path: build/BloodyMaster_artefacts/Release/VST3/Bloody Master.vst3
          if-no-files-found: error

      # Informatif : valide chargement, automation, mono/stereo. N'interrompt pas la publication des artefacts.
      - name: pluginval (informatif)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests "build/BloodyMaster_artefacts/Release/VST3/Bloody Master.vst3"
